  bio = "Cynthia Castillo is a **mathematician** with experience across a range of **data roles** in both industry—including finance, healthcare, manufacturing, and real estate—and academia. She currently works as a Data Visualization Engineer at Zillow and shares science communication content under the pseudonym **'La Matemaga'**, a project built on the idea that understanding is magic too. Through a variety of community programs, Cynthia connects cloud technologies, artificial intelligence, and data visualization with both technical and general audiences."
