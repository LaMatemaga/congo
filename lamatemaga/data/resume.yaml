  # ── EDUCACIÓN ──────────────────────────────────────────────────────
  - type: education
    title: "Licenciatura en Matemáticas"
    titleEN: "Bachelor's Degree in Mathematics"
    institution: "Universidad Autónoma de Nuevo León (UANL)"
    location: "Monterrey, México"
    description: >
      Programa de nueve semestres en matemáticas puras y aplicadas. Formación en **cálculo**
      (diferencial, integral, vectorial y de varias variables), **álgebra lineal** y **álgebra
      abstracta** (grupos, anillos y campos), **análisis matemático** y **topología**.
      Base sólida en **probabilidad**, **estadística**, **procesos estocásticos** y **análisis
      de regresión**. Materias aplicadas en **variable compleja**, **ecuaciones diferenciales**,
      **geometría moderna**, **modelado matemático**, **simulación**, **optimización**,
      **teoría de grafos** e **investigación de operaciones**.
      <br><br>
      Investigación en **bioinformática**: procesamiento de ~140,000 secuencias de la proteína
      Spike del SARS-CoV-2 desde **NCBI** con **R** para cinco modelos de análisis de datos,
      combinando minería de datos, **Random Forest**, **Análisis Topológico de Datos** y simulación
      computacional (publicado en revista indexada). Proyecto adicional en análisis de series de
      tiempo en pacientes con epilepsia. Impartió un curso de **R** y un taller de minería de
      datos a más de 700 estudiantes, y co-organizó la primera escuela de verano de modelado en
      la UANL, con más de 300 participantes de habla hispana.
    descriptionEN: >
      Nine-semester program in pure and applied mathematics. Coursework in **calculus**
      (differential, integral, vector, and multivariable), **linear algebra**, and **abstract
      algebra** (groups, rings, and fields), **mathematical analysis**, and **topology**.
      Strong foundation in **probability**, **statistics**, **stochastic processes**, and
      **regression analysis**. Applied studies in **complex variables**, **differential equations**,
      **modern geometry**, **mathematical modeling**, **simulation**, **optimization**,
      **graph theory**, and **operations research**.
      <br><br>
      Research in **bioinformatics**: extracted and processed ~140,000 SARS-CoV-2 Spike protein
      sequences from **NCBI** using **R** to build five data analysis models combining data mining,
      **Random Forest**, **Topological Data Analysis**, and computational simulation (published in an
      indexed journal). Additional project on time series analysis in epilepsy patients.
      Taught an **R** course and a data mining workshop to 700+ students, and co-organized the
      first summer school on modeling at UANL, reaching 300+ Spanish-speaking participants.
    sortDate: "2018-01-22"
    startDate: "2018-01-22"
    endDate: "2022-12-15"   # no recuerdo el dia exacto, pero fue en diciembre
    url: "https://www.fcfm.uanl.mx/"

  # ── PROFESIONAL ────────────────────────────────────────────────────

  - type: professional
    title: "Analista de Datos B2B"
    titleEN: "B2B Data Analyst"
    institution: "Hey Banco"
    location: "Monterrey, México"
    description: >
      Automatización de datos con **Amazon Redshift** para más de 20 visualizaciones en **Looker Studio**
      para cuatro equipos. Coordinación de bases de datos para diez journeys de clientes en
      **Salesforce Marketing Cloud**, aumentando la conversión entre etapas del ciclo de vida.
      Integración de **Amazon S3** y **SageMaker** para cuatro dashboards de monitoreo en **Tableau**.
      Documentación de nueve procesos recurrentes y reescritura de un **Jupyter Notebook** en **Python**
      que redujo los tiempos de carga en **Tableau** de minutos a segundos.
    descriptionEN: >
      Automated data extraction with **Amazon Redshift** to power 20+ **Looker Studio** dashboards across
      four teams. Coordinated databases for ten **Salesforce Marketing Cloud** customer journeys,
      improving lifecycle stage conversion. Integrated **Amazon S3** and **SageMaker** pipelines feeding
      four **Tableau** monitoring dashboards. Documented nine recurring processes and refactored a
      **Python** **Jupyter Notebook**, reducing **Tableau** load times from minutes to seconds.
    sortDate: "2021-12-01"
    startDate: "2021-12-20"
    endDate: "2023-08-05" # No estoy segura jeje
    url: "https://banco.hey.inc"

  - type: professional
    title: "Data Engineer"
    institution: "The Ksquare Group"
    location: "Remoto (Monterrey, México)"
    description: >
      Aseguró la calidad de datos en una base de datos **Databricks Delta Lake**, garantizando
      la precisión e integridad de la información a través de diversos pipelines.
      Creó visualizaciones detalladas en **Power BI** para comunicar insights accionables
      a stakeholders. Desarrolló un KPI de Confidence Score para vincular, emparejar y fusionar
      registros, mejorando la exactitud de datos de pacientes en un proyecto de salud.
      Realizó auditorías regulares e implementó medidas de control de calidad. Colaboró con
      equipos multifuncionales para traducir requerimientos de datos en soluciones técnicas.
    descriptionEN: >
      Secured data quality on a **Databricks Delta Lake** database, ensuring accuracy and integrity
      across various pipelines. Created detailed **Power BI** visualizations providing actionable
      insights to stakeholders. Developed a Confidence Score KPI to link, match, and merge records,
      improving patient data accuracy for a healthcare project. Conducted regular data audits and
      implemented quality control measures. Collaborated with cross-functional teams to translate
      data requirements into technical solutions.
    sortDate: "2023-08-01"
    startDate: "2023-08-06"  # No recuerdo jejeje
    endDate: "2024-05-31"
    url: "https://www.theksquaregroup.com/"

  - type: professional
    title: "Data Analyst"
    institution: "Honeywell"
    location: "Monterrey, México"
    description: >
      Diseño y mantenimiento de dashboards en **Tableau** y **Power BI** para el seguimiento de KPIs de
      compras y detección de anomalías en datos provenientes de **Snowflake** y documentos de
      **SharePoint**, habilitando la toma de decisiones proactiva y reducción de costos.
      Migración de flujos de datos en **Tableau Prep** y dashboards de **Tableau** a **SQL**,
      **Power Query**, **Power Automate** y **Power BI** como parte de un esfuerzo de unificación
      tecnológica en la organización.
    descriptionEN: >
      Designed and maintained **Tableau** and **Power BI** dashboards to track procurement KPIs and
      detect data anomalies, leveraging data from **Snowflake** and **SharePoint** for proactive
      decision-making and cost savings. Migrated **Tableau Prep** dataflows and **Tableau** dashboards
      to **SQL**, **Power Query**, **Power Automate**, and **Power BI** as part of a stack unification
      initiative across the organization.
    sortDate: "2024-07-01"
    startDate: "2024-07-29"
    endDate: "2025-11-28"
    url: "https://www.honeywell.com/mx/es"

  - type: professional
    title: "Data Visualization Engineer"
    institution: "Zillow Group"
    location: "Remoto (Monterrey, México)"
    description: >
      Desarrollo de visualizaciones interactivas de datos del mercado inmobiliario
      para productos consumer y herramientas internas. Stack principal: **React**,
      **D3.js**, **Python**, **dbt**, **Snowflake**.
    sortDate: "2025-12-01"
    startDate: "2025-12-01"
    endDate: "present"
    url: "https://www.zillow.com"


