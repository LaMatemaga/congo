[params.author]
  name = "Cynthia Castillo"
  image = "img/author.jpg"
  headline = "Entender también es magia"
  bio = "Cynthia Castillo es una **matemática** con experiencia en diversos **roles de datos** en campos tanto de la industria (como finanzas, salud, manufactura y bienes raíces) como de la academia. Actualmente trabaja como Data Visualization Engineer en Zillow y divulga bajo el pseudónimo de **'La Matemaga'**, un proyecto de divulgación científica que parte de la premisa de que entender también es magia. A través de diferentes programas de comunidades, Cynthia conecta tecnologías cloud, inteligencia artificial y visualización de datos con audiencias técnicas y generales."
